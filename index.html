<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <title>QR Code Component</title>
</head>

<body>
  <!-- Wrapper -->
  <main class="wrapper">

    <!-- Card   -->
    <section class="card">
    
      <!-- QR Code Image -->
      <figure class="qr-container">
        <img src="https://github.com/Kking927/Frontend-Mentor-QR-Code-Component/blob/main/images/image-qr-code.png?raw=true" alt="QR code to Frontend Mentor website">
      </figure>

      <!--   Headline -->
      <div class="card-content">
        <h1 class="card-title">Improve your front-end skills by building projects</h1>

        <!--   Body Text -->
        <p class="card-description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>

    </section>
  </main>
</body>

</html>
